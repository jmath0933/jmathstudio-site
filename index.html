<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jmath Studio</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .wrap {
      max-width: 760px;
      padding: 40px 24px;
      text-align: center;
    }
    h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }
    p {
      font-size: 24px;
      line-height: 1.6;
      color: #d0d0d0;
    }
    .section {
      margin-top: 40px;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 28px;
      border-radius: 12px;
      background: #ffffff;
      color: #000;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }
    .links a {
      color: #9fd3ff;
      text-decoration: none;
      margin: 0 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Jmath Studio</h1>
    <p>We create mobile puzzle games and apps.</p>

    <div class="section">
      <p>Jmath Studio is an independent game studio focused on simple and intuitive puzzle experiences.</p>
    </div>

    <div class="section">
      <h2>Featured Game</h2>
      <p>Line To Spot</p>
      <p>Connect matching colors without crossing lines.</p>
      <a class="button" href="/LineToSpot/">View Line To Spot</a>
    </div>

    <div class="section">
      <p>Contact: contact@jmathstudio.com</p>
      <div class="links">
        <a href="/LineToSpot/privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
</body>
</html>
